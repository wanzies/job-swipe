<style>

.tk{display:flex;flex-direction:column;gap:12px;font-size:13px}.tk button,.tk input{font:inherit}

.tk-r1{display:flex;gap:8px}

.tk-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tk-sg{position:relative;display:block}
.tk-sg input{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;padding:0;opacity:0;cursor:pointer}
.tk-sg span{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:6px;text-align:center;font-family:"Press Start 2P",monospace;font-size:8px;line-height:1.5;border:3px solid var(--c1);color:var(--c3)}
.tk-sg span::before{content:"";flex:0 0 10px;height:10px;background:var(--m)}
.tk-sg input:checked+span{background:var(--c3);color:var(--c0);border-color:var(--c3)}
.tk-sg input:focus-visible+span,.tk button:focus-visible,.tk summary:focus-visible{outline:3px dashed var(--c3);outline-offset:3px}
.tk-r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tk-r2 label{display:flex;flex-direction:column;gap:4px;min-width:0}.tk-r2 label span{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--c2)}
.tk-bar{display:flex;flex-direction:column;gap:10px}
.tk-fc{font-family:"Press Start 2P",monospace;font-size:8px;line-height:1.4;background:var(--c0);color:var(--c3);border:3px solid var(--c1);padding:8px;min-height:40px;cursor:pointer}
.tk-fc[aria-pressed=true]{background:var(--c3);color:var(--c0);border-color:var(--c3)}
.tk-fc[class*=tk-u]::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--m)}
.tk-ls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tk-it{display:flex;align-items:flex-start;gap:8px;padding:10px 6px 10px 12px;border:3px solid var(--c1);background:#17231d;position:relative}
.tk-it::before{content:"";position:absolute;left:-3px;top:-3px;bottom:-3px;width:7px;background:var(--m)}
.tk-it.od{border-color:var(--c3);background:repeating-linear-gradient(135deg,#17231d 0 8px,#1f3027 8px 10px)}
.tk-ed::before{display:none}.tk-ed{display:block;padding:12px;border-color:var(--c2)}
.tk-ck{flex:0 0 44px;width:44px;height:44px;margin:-6px 0 -6px 0;padding:0;background:none;border:0;display:grid;place-items:center;cursor:pointer}
.tk-ck i{width:24px;height:24px;display:grid;place-items:center;border:3px solid var(--c3)}
.tk-ck svg{width:16px;height:16px;stroke:var(--c0);fill:none;stroke-width:4;stroke-linecap:square;opacity:0;shape-rendering:crispEdges}
.tk-ck[aria-checked=true] i{background:var(--c3)}.tk-ck[aria-checked=true] svg{opacity:1}
.tk-bd{flex:1;min-width:0}.tk-tt{font-weight:600;font-size:14px;line-height:1.4;word-break:break-word}
.tk-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px}
.tk-ch{position:relative;font-family:"Press Start 2P",monospace;font-size:8px;line-height:1.4;background:var(--c0);color:var(--c3);border:2px solid var(--c2);padding:4px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tk-ch::before{content:"";width:8px;height:8px;background:var(--m)}.tk-ch::after{content:"";position:absolute;inset:-10px -4px}
.tk-due{font-family:"Press Start 2P",monospace;font-size:8px;line-height:1.5;color:var(--c2);display:inline-flex;align-items:center;gap:4px}.tk-due svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;shape-rendering:crispEdges}
.tk-due.od{background:var(--c3);color:var(--c0);padding:3px 6px}.tk-due.td{color:var(--c3);text-decoration:underline;text-underline-offset:3px}
.tk-abs{font-size:11px;color:var(--c2)}.tk-nt{font-size:12px;color:var(--c2);margin-top:6px;white-space:pre-wrap;word-break:break-word}
.tk-ac{display:flex;flex:0 0 auto}.tk-ac button{width:40px;height:44px;border:0;background:none;color:var(--c2);display:grid;place-items:center;cursor:pointer}.tk-ac button:hover{color:var(--c3)}
.tk-ac svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:square;shape-rendering:crispEdges}
.tk-it.dn{opacity:.75}.tk-it.dn .tk-tt{text-decoration:line-through}
.tk-ea{display:flex;gap:8px;justify-content:flex-end}
.tk-empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:20px 10px;border:3px dashed var(--c1);color:var(--c2)}
.tk-empty svg{width:36px;height:36px;stroke:var(--c2);fill:none;stroke-width:3;shape-rendering:crispEdges}.tk-empty b{font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.6;color:var(--c3)}
.tk-dn summary{font-family:"Press Start 2P",monospace;font-size:10px;cursor:pointer;padding:10px 0;list-style:none;color:var(--c2)}.tk-dn summary::-webkit-details-marker{display:none}.tk-dn summary::before{content:"▶ "}.tk-dn[open] summary::before{content:"▼ "}
.tk-dn summary b{background:var(--c1);color:var(--c3);padding:1px 6px}.tk-clr{margin-top:10px}
.tk-ft{display:flex;flex-direction:column;gap:8px}.tk-hint{margin:0;font-size:11px;color:var(--c2)}
.tk-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,16px);background:var(--c3);color:var(--c0);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;box-shadow:6px 6px 0 var(--c1);font-size:13px;opacity:0;pointer-events:none;z-index:70;max-width:calc(100vw - 24px)}
.tk-toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.tk-toast button{background:var(--c0);color:var(--c3);box-shadow:none}
</style></head><body>
<header><h1 class="px" id="greg"></h1><div class="hj px" id="hijri"></div><div class="wx px" id="wx">LOADING WEATHER…</div><div class="sky" id="sky"></div><canvas id="city" width="160" height="44" style="width:100%;min-height:110px;height:auto;image-rendering:pixelated;display:block;margin-top:10px;border:2px solid var(--c1)"></canvas><div id="nref" style="font-size:9px;opacity:.45;margin-top:6px;letter-spacing:1px"></div></header>
<main>
<section class="w"><div class="t px"><span>✅ TASKS</span><span>URGENT FIRST</span></div><div id="tkRoot" data-ease="steps(5,end)" data-dur="280"></div></section>

<script>
/* ================= TASKS · to-do list. Data lives in localStorage only (dash-tasks-v1), never in the repo ================= */
const TASKS=(()=>{
const root=document.getElementById("tkRoot");if(!root)return null;
const KEY="dash-tasks-v1",NK="dash-tasks-notify-v1",NS="dash-tasks-notified-v1";
const UL=["Urgent","Not so urgent","Not urgent"];
const RM=matchMedia("(prefers-reduced-motion: reduce)"),EASE=root.dataset.ease||"cubic-bezier(.2,.8,.2,1)",DUR=+root.dataset.dur||300;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)];
const IC={ed:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
 del:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg>',
 ck:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.5 4.5L19 7.5"/></svg>',
 al:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16v.01"/></svg>',
 ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>'};
let T=[],ui={f:"all",q:"",ed:null,fe:false,dOpen:false,first:true},undo=null,tt=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const ymd=dt=>{dt=dt||new Date();return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())};
const dayNum=s=>{const p=s.split("-").map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5)};
const fmtD=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"})};
const fmtT=s=>{const p=s.split(":").map(Number);return new Date(2000,0,1,p[0],p[1]).toLocaleTimeString("en-SG",{hour:"numeric",minute:"2-digit"}).replace(/\s/g," ").toUpperCase()};

(function(){const end=new Date("2027-10-31T00:00:00+08:00"),st=new Date("2025-10-31T00:00:00+08:00"),now=new Date(),d=Math.ceil((end-now)/864e5);
 $("bond").textContent=d+" DAYS";$("bondbar").style.width=Math.min(100,(now-st)/(end-st)*100)+"%";$("bondsub").textContent=`About ${Math.round(d/30.4)} months to go · free from Oct 2027`})();

let qp=LS("qpos")||{page:39,ref:"2:238"};
function qShow(){$("qpos").innerHTML=`Next: <b>Surah ${qp.ref.replace(":"," · verse ")}</b> · page ${qp.page}/604`}qShow();
async function qLoad(p){$("qhead").textContent="PAGE "+p+"/604";$("qbody").textContent="Loading…";try{
 const [a,e]=await Promise.all(["quran-uthmani","en.sahih"].map(ed=>fetch(`https://api.alquran.cloud/v1/page/${p}/${ed}`).then(r=>r.json())));
 const A=a.data.ayahs,E=e.data.ayahs;$("qbody").innerHTML=A.map((x,i)=>`<div class="ay${x.surah.number+":"+x.numberInSurah==qp.ref?" cur":""}"><div class="px" style="font-size:8px;color:var(--c2)">${x.surah.englishName} ${x.surah.number}:${x.numberInSurah}</div><div class="ar">${x.text}</div><div class="en">${E[i].text}</div></div>`).join("");
 qr.last=A[A.length-1];qr.first=A[0];const c=document.querySelector(".ay.cur");if(c)c.scrollIntoView();else $("qr").scrollTop=0}catch(_){$("qbody").textContent="Couldn't load the page. Check your connection."}}
function qOpen(){$("qr").classList.add("on");qr.p=qp.page;qLoad(qr.p)}
function qDone(){const l=qr.last;if(!l)return;logSheet("quran",{day:sgDay(),page:qr.p,upto:l.surah.number+":"+l.numberInSurah});
 qp={page:Math.min(604,qr.p+1),ref:qr.p>=604?"1:1":""};LS("qpos",qp)}
function qGo(d){if(d>0){qDone();if(qr.p>=604)return qStop();qr.p++}else if(qr.p>1)qr.p--;qp.page=qr.p;qLoad(qr.p).then(()=>{if(qr.first){qp.ref=qr.first.surah.number+":"+qr.first.numberInSurah;LS("qpos",qp);qShow()}})}
function qStop(){$("qr").classList.remove("on");LS("qpos",qp);qShow();logSheet("quran-stop",{day:sgDay(),page:qp.page,next:qp.ref})}
let tx=0;$("qr").addEventListener("touchstart",e=>tx=e.touches[0].clientX);$("qr").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>80)qGo(dx>0?1:-1)});
// dhikr garden
let dc=LS("dhikr")||0;const ST=["·","🌱","🌿","🪴","🌳"];
function dDraw(){const full=Math.floor(dc/100)%10,cur=dc%100;let h="";for(let i=0;i<10;i++)h+=i<full?`<span>🌳</span>`:i==full?`<span class="grow">${ST[Math.min(4,Math.floor(cur/25))]}</span>`:`<span></span>`;
 $("gd").innerHTML=h;$("dsum").textContent=`${dc} total · plant ${full+1}: ${cur}/100 · garden ${Math.floor(dc/1000)+1}`}
function dTap(){dc++;LS("dhikr",dc);dDraw();if(navigator.vibrate)navigator.vibrate(dc%100?8:[60,40,60])}
function dUndo(){if(dc>0){dc--;LS("dhikr",dc);dDraw()}}dDraw();
// rest
const RL=["😵","😩","😐","🙂","😄"];function rDraw(){const r=LS("rest")||{},t=sgDay();$("rs").innerHTML=RL.map((e,i)=>`<button class="b2" style="${r[t]==i+1?"outline:3px solid var(--c3)":""}" onclick="rSet(${i+1})">${e}</button>`).join("");
 const days=[...Array(7)].map((_,i)=>new Date(Date.now()-i*864e5+(new Date().getTimezoneOffset()+480)*6e4).toISOString().slice(0,10)).reverse();
 $("rtrend").textContent="7 DAYS: "+days.map(d=>r[d]?"▁▂▄▆█"[r[d]-1]:"·").join(" ")}
function rSet(v){const r=LS("rest")||{};r[sgDay()]=v;LS("rest",r);rDraw();logSheet("rest",{day:sgDay(),score:v})}rDraw();

fetch("https://api.rss2json.com/v1/api.json?rss_url="+q).then(r=>r.json()).then(d=>{const it=(d.items||[]).slice(0,6);if(!it.length)throw 0;
 document.getElementById("nwT").textContent="LAST 24H";
 document.getElementById("news").innerHTML=it.map(x=>{const p=x.title.lastIndexOf(" - "),t=p>0?x.title.slice(0,p):x.title,src=p>0?x.title.slice(p+3):"";const h=Math.max(0,Math.round((Date.now()-new Date(x.pubDate.replace(" ","T")+"Z"))/36e5));
 return `<a href="${x.link}" target="_blank" style="display:block;color:var(--c3);text-decoration:none;border-bottom:2px dashed var(--c1);padding:8px 0">▸ ${esc(t)}<div class="px" style="font-size:8px;color:var(--c2);margin-top:4px">${esc(src)} · ${h}H AGO</div></a>`}).join("")})
 .catch(()=>document.getElementById("news").textContent="Headlines unavailable right now.")})();

(function(){const cv=document.getElementById("city"),x=cv.getContext("2d"),W=160,H=44,C=["#0e1512","#2d4636","#86a38a","#e2e8d6"];
const B=[[4,14,12],[18,10,18],[30,16,8],[110,8,26],[122,12,32],[136,10,22],[148,10,28]];// x,w,h ; left=homes right=offices
const ppl=[...Array(9)].map((_,i)=>({p:Math.random(),v:.0015+Math.random()*.002,bag:i%2}));let drops=[...Array(30)].map(()=>[Math.random()*W,Math.random()*H]),t=0;
function hr(){return new Date(Date.now()+(new Date().getTimezoneOffset()+480)*6e4).getHours()}
function f(c,a,b,w,h){x.fillStyle=C[c];x.fillRect(a|0,b|0,w,h)}
function draw(){t++;const h=hr(),night=h<6||h>=19,dir=h>=5&&h<12?1:h>=16&&h<21?-1:0,k=window.WK||"sun";
 f(night?0:k==="sun"?1:0,0,0,W,H);
 if(night){for(let i=0;i<12;i++)if((i*7+t/20|0)%5)f(2,(i*37)%W,(i*13)%14+2,1,1);f(3,70,5,5,5);f(night?0:1,72,4,4,4)}
 else if(k==="sun"){f(3,74,4,7,7);if(t%40<20){f(3,72,7,1,1);f(3,82,7,1,1)}}
 else{const cx=(t/6)%(W+30)-30;f(2,cx,6,22,5);f(2,cx+5,3,12,4);f(2,cx+70,9,16,4)}
 B.forEach(([a,w,bh],i)=>{f(1,a,H-6-bh,w,bh);for(let yy=H-4-bh;yy<H-8;yy+=4)for(let xx=a+2;xx<a+w-2;xx+=4){const lit=night?((xx+yy+i)%3!=0):(i>=3&&dir!==0);f(lit?3:0,xx,yy,2,2)}});
 f(1,40,H-14,4,8);f(2,38,H-17,8,3);// tree
 f(2,0,H-6,W,6);f(1,0,H-4,W,1);
 const n=dir===0?(night?1:3):9;ppl.slice(0,n).forEach((q,i)=>{if(dir){q.p+=q.v*dir;if(q.p>1)q.p=0;if(q.p<0)q.p=1}else q.p+=Math.sin(t/60+i)*.0008;
  const px=46+q.p*60,leg=(t/8|0)%2;f(3,px,H-13,2,2);f(night?2:3,px,H-11,2,3);f(3,px-(leg?1:0),H-8,1,2);f(3,px+1+(leg?1:0),H-8,1,2);if(q.bag&&dir===1)f(2,px+2,H-10,2,2);if(k==="rain")f(2,px-1,H-15,4,1)});
 if(k==="rain")drops.forEach(d=>{d[1]+=2;d[0]-=.5;if(d[1]>H-6){d[1]=0;d[0]=Math.random()*W}f(2,d[0],d[1],1,2)});
 requestAnimationFrame(draw)}draw()})();
