<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Amiri:wght@700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--c0:#0e1512;--c1:#2d4636;--c2:#86a38a;--c3:#e2e8d6}
*{box-sizing:border-box}body{margin:0;background:var(--c0);color:var(--c3);font:15px/1.55 "IBM Plex Mono",monospace;image-rendering:pixelated}
.px{font-family:"Press Start 2P",monospace;letter-spacing:.02em}
header{padding:16px;border-bottom:4px solid var(--c1);position:relative;overflow:hidden;min-height:128px}
header h1{font-size:12px;margin:0 0 8px;color:var(--c3)}header .hj{font-size:10px;color:var(--c2)}
.wx{margin-top:14px;font-size:10px;color:var(--c2)}.wx b{font-size:18px;color:var(--c3);margin-right:6px}
.gear{position:absolute;right:12px;top:12px;background:var(--c1);color:var(--c3);border:0;padding:8px 10px;font-size:10px;box-shadow:3px 3px 0 var(--c2);cursor:pointer}
.sky{position:absolute;right:18px;bottom:14px;width:64px;height:48px}
.psun{position:absolute;right:8px;top:6px;width:24px;height:24px;background:var(--c3);box-shadow:0 -8px 0 -4px var(--c2),0 8px 0 -4px var(--c2),8px 0 0 -4px var(--c2),-8px 0 0 -4px var(--c2);animation:blink 2s steps(2) infinite}
.pcl{position:absolute;left:0;top:14px;width:40px;height:12px;background:var(--c2);box-shadow:8px -8px 0 0 var(--c2),20px -8px 0 0 var(--c2);animation:mv 6s steps(6) infinite alternate}
.pdr{position:absolute;width:3px;height:6px;background:var(--c3);animation:dr .6s steps(4) infinite}
@keyframes blink{50%{opacity:.6}}@keyframes mv{to{transform:translateX(18px)}}@keyframes dr{from{transform:translateY(28px)}to{transform:translateY(48px)}}
main{max-width:640px;margin:0 auto;padding:12px}
.w{border:4px solid var(--c1);background:#131d18;margin-bottom:14px;padding:12px;box-shadow:6px 6px 0 var(--c1)}
.t{font-size:10px;color:var(--c2);margin:0 0 10px;display:flex;justify-content:space-between}
a{color:var(--c3)}.ref{font-size:12px;color:var(--c2)}
.vid{position:relative;padding-top:56.25%;border:3px solid var(--c1);margin-bottom:8px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vt{font-size:12px;color:var(--c2);margin-bottom:10px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start}.dots{text-align:center;margin-top:8px}.dots i{display:inline-block;width:8px;height:8px;background:var(--c1);margin:0 4px}.dots i.on{background:var(--c3)}
.flip{perspective:900px;cursor:pointer;height:220px}.fi{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.flip.on .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;border:3px dashed var(--c1)}
.fb{transform:rotateY(180deg);background:#17231d}
.ar{font-family:Amiri,serif;font-size:64px;line-height:1.2;color:var(--c3)}.tr{font-size:11px;color:var(--c2);margin-top:10px}
.hint{font-size:9px;color:var(--c1);margin-top:12px}
.jobs iframe{width:100%;height:760px;border:0}
.fast{font-size:12px;color:var(--c2);border:2px solid var(--c1);padding:8px;margin-bottom:14px}
#set{position:fixed;inset:0;background:rgba(14,21,18,.97);display:none;z-index:9;padding:16px;overflow:auto}
#set h2{font-size:12px}#q{width:100%;padding:12px;background:var(--c0);color:var(--c3);border:3px solid var(--c2);font:inherit}
.sg{border:2px solid var(--c1);border-top:0}.sg div{padding:10px;cursor:pointer;border-top:1px solid var(--c1)}.sg div:hover,.sg div:active{background:var(--c1)}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--c1);padding:6px 10px;margin:4px 4px 0 0;font-size:12px}.chip button{background:none;border:0;color:var(--c3);cursor:pointer}
.btn{background:var(--c3);color:var(--c0);border:0;padding:10px 14px;font-size:10px;margin-top:18px;box-shadow:4px 4px 0 var(--c2);cursor:pointer}
.wd{text-align:center}.big{font-size:22px;margin:10px 0}.clock{width:72px;height:72px;margin:6px auto;border:4px solid var(--c3);position:relative;border-radius:0}
.clock i{position:absolute;left:32px;top:6px;width:4px;height:30px;background:var(--c2);transform-origin:2px 30px;animation:tk 4s steps(8) infinite}@keyframes tk{from{transform:rotate(-40deg)}to{transform:rotate(-4deg)}}
.bar{height:18px;border:3px solid var(--c3);margin:10px 0;position:relative}.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--c2);animation:fill 2s steps(10) forwards}@keyframes fill{from{width:0}}
.globe{width:48px;height:48px;margin:6px auto;background:var(--c1);box-shadow:inset 8px 0 0 var(--c2),inset -8px 0 0 var(--c0);animation:spin 3s steps(4) infinite}@keyframes spin{25%{box-shadow:inset 16px 0 0 var(--c2),inset -4px 0 0 var(--c0)}50%{box-shadow:inset 4px 0 0 var(--c2),inset -16px 0 0 var(--c0)}}
</style></head><body>
<header><h1 class="px" id="greg"></h1><div class="hj px" id="hijri"></div><div class="wx px" id="wx">LOADING WEATHER…</div><div class="sky" id="sky"></div></header>
<main>
<div id="fast"></div>
<section class="w"><div class="t px"><span>▶ WATCH</span></div><div id="yt"></div></section>
<section class="w"><div class="t px"><span id="qhLbl">📖 QURAN</span><span>◀ SWIPE ▶</span></div><div class="car" id="car"></div><div class="dots" id="qdots"><i class="on"></i><i></i></div></section>
<section class="w"><div class="t px"><span>✦ NAMES OF ALLAH</span></div><div class="flip" id="flip" onclick="this.classList.toggle('on')"><div class="fi"><div class="fa"><div class="ar" id="nAr"></div><div class="tr px" id="nTr"></div><div class="hint px">TAP TO REVEAL</div></div><div class="fb"><div class="px" style="font-size:10px;margin-bottom:10px" id="nMean"></div><div style="font-size:13px" id="nTxt"></div><div class="ref" id="nRef" style="margin-top:8px"></div></div></div></div></section>
<section class="w"><div class="t px"><span>❝ SCHOLARS</span></div><div id="quote"></div></section>
<section class="w"><div class="t px"><span id="wLbl">🌍 WORLD WATCH</span><span>◀ SWIPE ▶</span></div><div class="car" id="wcar"></div><div class="dots" id="wdots"></div></section>
<section class="w jobs"><div class="t px"><span>💼 JOBS</span></div><iframe src="jobs.html" title="Job swipe"></iframe></section>
</main>
<script>
const $=s=>document.getElementById(s),esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mine=[{n:"Nurul Asror",id:"UCbgvB0fCeXC9u9Ue9-awSNg"}];
const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Singapore"}));
const ymd=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
$("greg").textContent=now.toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short",year:"numeric"}).toUpperCase();
fetch("https://api.open-meteo.com/v1/forecast?latitude=1.35&longitude=103.82&current=temperature_2m,weather_code,is_day&daily=precipitation_probability_max&timezone=Asia%2FSingapore&forecast_days=1").then(r=>r.json()).then(d=>{
 const c=d.current.weather_code,k=c>=51?"rain":c>=2?"cloud":"sun",s=$("sky");
 if(k==="sun")s.innerHTML='<div class="psun"></div>';else{s.innerHTML='<div class="pcl"></div>';if(k==="rain")for(let i=0;i<6;i++)s.innerHTML+=`<div class="pdr" style="left:${6+i*9}px;animation-delay:-${i*.1}s"></div>`}
 $("wx").innerHTML=`<b>${Math.round(d.current.temperature_2m)}°</b>${{sun:d.current.is_day?"CLEAR":"CLEAR NIGHT",cloud:"CLOUDY",rain:c>=95?"STORM":"RAIN"}[k]} · ${d.daily.precipitation_probability_max[0]}% RAIN`}).catch(()=>$("wx").textContent="WEATHER OFFLINE");
let D={};
function renderYT(){let h="";(D.videos||[]).forEach(v=>h+=`<div class="vid"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${v.id}${v.start?"?start="+v.start:""}" allowfullscreen></iframe></div><div class="vt">${esc(v.title)}</div>`);
 mine.forEach(c=>h+=`<div class="vid"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/videoseries?list=UU${c.id.slice(2)}" allowfullscreen></iframe></div><div class="vt">Latest from ${esc(c.n)}</div>`);
 $("yt").innerHTML=h||''}
fetch("daily/"+ymd+".json").then(r=>r.ok?r:fetch("daily/latest.json")).then(r=>r.json()).then(d=>{D=d;
 $("hijri").textContent=(d.hijri||"").toUpperCase();if(d.fast)$("fast").innerHTML=`<div class="fast">🌙 ${esc(d.fast)}</div>`;renderYT();
 const sl=(x,l)=>x?`<div class="slide" data-l="${l}"><p>“${esc(x.text)}”</p><p class="ref"><a href="${x.url}" target="_blank">${esc(x.ref)} ↗</a></p></div>`:"";
 $("car").innerHTML=sl(d.verse,"📖 QURAN")+sl(d.hadith,"📜 HADITH");
 const n=d.name||{};$("nAr").textContent=n.ar||"";$("nTr").textContent=(n.tr||"").toUpperCase();$("nMean").textContent=(n.meaning||"").toUpperCase();$("nTxt").textContent=n.text||"";if(n.url)$("nRef").innerHTML=`<a href="${n.url}" target="_blank">Source ↗</a>`;

 const W=d.world||[];$("wcar").innerHTML=W.map(x=>`<div class="slide wd"><div class="px" style="font-size:10px;color:var(--c2)">${esc(x.src)}</div>${x.kind==="clock"?'<div class="clock"><i></i></div>':x.kind==="bar"?`<div class="bar"><b style="width:${x.pct}%"></b></div>`:'<div class="globe"></div>'}${x.big?`<div class="big px">${esc(x.big)}</div>`:""}${x.vid?`<div class="vid"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/videoseries?list=UU${x.vid.slice(2)}" allowfullscreen></iframe></div>`:""}<p style="font-size:13px">${esc(x.text)}</p><p class="ref"><a href="${x.url}" target="_blank">Source ↗</a></p></div>`).join("");
 $("wdots").innerHTML=W.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("");
 const q=d.quote;if(q)$("quote").innerHTML=`<p>“${esc(q.text)}”</p><p class="ref">— ${esc(q.by)} · <a href="${q.url}" target="_blank">${esc(q.date||"source")} ↗</a></p>`});
$("car").addEventListener("scroll",e=>{const i=Math.round(e.target.scrollLeft/e.target.clientWidth);e.target.nextElementSibling.querySelectorAll("i").forEach((d,k)=>d.className=k===i?"on":"");const s=e.target.children[i];if(s)$("qhLbl").textContent=s.dataset.l});
</script></body></html>
<script>document.getElementById("wcar").addEventListener("scroll",e=>{const i=Math.round(e.target.scrollLeft/e.target.clientWidth);document.querySelectorAll("#wdots i").forEach((d,k)=>d.className=k===i?"on":"")})</script>
