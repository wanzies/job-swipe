<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syazwan's Daily</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f5f4;color:#1d2a26}
.hero{position:relative;overflow:hidden;color:#fff;padding:22px 18px 26px;min-height:190px;background:linear-gradient(160deg,#3a8dde,#7cc4f5)}
.hero.rain{background:linear-gradient(160deg,#4b5d6e,#8797a6)}.hero.cloud{background:linear-gradient(160deg,#6f8fae,#b5c7d8)}.hero.storm{background:linear-gradient(160deg,#2c3440,#5a6470)}.hero.night{background:linear-gradient(160deg,#0f1c3a,#33457a)}
.hero h1{margin:0;font-size:22px;position:relative;z-index:2}.hero .hj{opacity:.9;margin-top:4px;position:relative;z-index:2}
.wx{position:relative;z-index:2;margin-top:14px;font-size:15px}.wx b{font-size:30px;margin-right:6px}
.sun{position:absolute;right:24px;top:22px;width:70px;height:70px;border-radius:50%;background:#ffd34d;box-shadow:0 0 40px #ffd34d;animation:pulse 4s ease-in-out infinite}
.moon{position:absolute;right:28px;top:24px;width:56px;height:56px;border-radius:50%;box-shadow:-14px 6px 0 0 #f4f1d0}
@keyframes pulse{50%{transform:scale(1.08)}}
.cl{position:absolute;width:120px;height:40px;background:#fff;opacity:.85;border-radius:40px;animation:drift 22s linear infinite}
.cl:before{content:"";position:absolute;width:56px;height:56px;background:inherit;border-radius:50%;top:-26px;left:22px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.drop{position:absolute;top:-20px;width:2px;height:16px;background:rgba(255,255,255,.7);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(260px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl 6s infinite}@keyframes fl{0%,92%,100%{opacity:0}94%{opacity:.6}}
main{padding:14px;max-width:640px;margin:0 auto}
.c{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1f7a5a;margin-bottom:6px}
.c p{margin:4px 0;line-height:1.5}.ref{font-size:13px;color:#667}a{color:#1f7a5a}
.fast{background:#e8f6ef;border-left:4px solid #1f7a5a}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin:8px 0 4px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.jobs iframe{width:100%;height:760px;border:0;border-radius:12px}
</style></head><body>
<section class="hero" id="hero"><h1 id="greg"></h1><div class="hj" id="hijri"></div><div class="wx" id="wx">Loading Singapore weather…</div></section>
<main id="m"></main>
<script>
const $=s=>document.getElementById(s),esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Singapore"}));
const ymd=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
$("greg").textContent=now.toLocaleDateString("en-SG",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
// weather
function anim(kind,night){const h=$("hero");h.className="hero "+(night&&kind==="sun"?"night":kind);
 if(kind==="sun")h.insertAdjacentHTML("beforeend",night?'<div class="moon"></div>':'<div class="sun"></div>');
 if(kind!=="sun")for(let i=0;i<3;i++)h.insertAdjacentHTML("beforeend",`<div class="cl" style="top:${20+i*45}px;animation-delay:-${i*7}s;animation-duration:${20+i*6}s"></div>`);
 if(kind==="rain"||kind==="storm")for(let i=0;i<50;i++)h.insertAdjacentHTML("beforeend",`<div class="drop" style="left:${Math.random()*100}%;animation-duration:${.5+Math.random()*.5}s;animation-delay:-${Math.random()}s"></div>`);
 if(kind==="storm")h.insertAdjacentHTML("beforeend",'<div class="flash"></div>')}
fetch("https://api.open-meteo.com/v1/forecast?latitude=1.35&longitude=103.82&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSingapore&forecast_days=1")
.then(r=>r.json()).then(d=>{const c=d.current.weather_code,n=!d.current.is_day;
 const k=c>=95?"storm":c>=51?"rain":c>=2?"cloud":"sun",lbl={storm:"Thunderstorms",rain:"Rain",cloud:"Cloudy",sun:n?"Clear night":"Sunny"}[k];anim(k,n);
 $("wx").innerHTML=`<b>${Math.round(d.current.temperature_2m)}°</b>${lbl} · ${Math.round(d.daily.temperature_2m_min[0])}–${Math.round(d.daily.temperature_2m_max[0])}° · ${d.daily.precipitation_probability_max[0]}% chance of rain`})
.catch(()=>{anim("cloud");$("wx").textContent="Weather unavailable right now"});
// content
const card=(k,html,cls="")=>`<div class="c ${cls}"><div class="k">${k}</div>${html}</div>`;
fetch("daily/"+ymd+".json").then(r=>r.ok?r:fetch("daily/latest.json")).then(r=>r.json()).then(d=>{
 $("hijri").textContent=d.hijri||"";let h="";
 if(d.fast)h+=card("🌙 Coming up",`<p>${esc(d.fast)}</p>`,"fast");
 if(d.blessing)h+=card("🤲 Blessing to notice",`<p>${esc(d.blessing)}</p>`);
 if(d.verse)h+=card("📖 Quran",`<p>“${esc(d.verse.text)}”</p><p class="ref"><a href="${d.verse.url}" target="_blank">${esc(d.verse.ref)} ↗</a></p>`);
 if(d.hadith)h+=card("📜 Hadith",`<p>“${esc(d.hadith.text)}”</p><p class="ref"><a href="${d.hadith.url}" target="_blank">${esc(d.hadith.ref)} ↗</a></p>`);
 if(d.lesson)h+=card("💡 Lesson · "+esc(d.lesson.title),`<p>${esc(d.lesson.text)}</p>${d.lesson.url?`<p class="ref"><a href="${d.lesson.url}" target="_blank">Source ↗</a></p>`:""}`);
 if(d.quote)h+=card("💬 "+esc(d.quote.by),`<p>“${esc(d.quote.text)}”</p><p class="ref"><a href="${d.quote.url}" target="_blank">${esc(d.quote.date||"View post")} ↗</a></p>`);
 (d.videos||[]).forEach(v=>h+=card("▶️ Watch",`<p>${esc(v.title)}</p><div class="vid"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${v.id}${v.start?"?start="+v.start:""}" allow="encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`));
 $("m").insertAdjacentHTML("afterbegin",h)}).catch(()=>$("m").insertAdjacentHTML("afterbegin",card("Today","<p>Today's reminder isn't ready yet.</p>")));
$("m").innerHTML=card("💼 Your jobs",'<iframe src="jobs.html" title="Job swipe"></iframe>',"jobs");
</script></body></html>
